<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nuit Noire Tattoo - Salon de tatouage indépendant à Genève." />
  <title>Nuit Noire Tattoo - Genève</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo-mini-cream.svg">
</head>
<body data-page="home">

  <div id="nav-mount"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-video">
      <video
        src="assets/intromoviedesktop.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        aria-label="Nuit Noire Tattoo"
      ></video>

      <a href="#travaux" class="hero-scroll" aria-label="Voir les derniers travaux">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </a>
    </div>
  </section>

  <!-- INTRO -->
  <section class="intro">
    <p id="intro-text">
      <!-- Texte injecté -->
    </p>
  </section>

  <!-- LATEST WORK -->
  <section class="latest-work" id="travaux">
    <div class="latest-work-header">
      <h2 id="latest-work-title">Latest work</h2>
      <a href="" target="_blank" rel="noopener" class="latest-work-handle" id="latest-work-handle"></a>
    </div>

    <div class="latest-work-grid" id="latest-work-grid">
      <!-- Injecté par JS -->
    </div>

    <div class="latest-work-footer">
      <a href="artists.html" class="link-underline" data-i18n="home_view_artists">Voir les artistes →</a>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="js/i18n.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>

  <!-- Ajuste la hauteur du hero video pour qu'il rentre pile sous la nav -->
  <script>
    (function () {
      function setHeroHeight() {
        var nav = document.querySelector('.nav');
        var navH = nav ? nav.getBoundingClientRect().height : 0;
        var h = Math.max(0, window.innerHeight - navH);
        document.documentElement.style.setProperty('--hero-h', h + 'px');
      }
      window.addEventListener('resize', setHeroHeight);
      window.addEventListener('load', setHeroHeight);
      document.addEventListener('DOMContentLoaded', setHeroHeight);
      // La nav est injectee dans #nav-mount de facon asynchrone : on recalcule des qu'elle apparait
      var mount = document.getElementById('nav-mount');
      if (mount && 'MutationObserver' in window) {
        new MutationObserver(setHeroHeight).observe(mount, { childList: true, subtree: true });
      }
      setHeroHeight();
    })();
  </script>
</body>
</html>
