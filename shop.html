<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Shop - Prints et merch - Nuit Noire Tattoo Genève</title>
  <meta name="description" content="Prints et objets du shop Nuit Noire à Genève. Commande par email ou Instagram, expédition ou retrait au shop." />
  <link rel="canonical" href="https://www.nuitnoiretattoo.com/shop" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nuit Noire Tattoo" />
  <meta property="og:locale" content="fr_CH" />
  <meta property="og:url" content="https://www.nuitnoiretattoo.com/shop" />
  <meta property="og:title" content="Shop - Prints et merch - Nuit Noire Tattoo Genève" />
  <meta property="og:description" content="Prints et objets du shop Nuit Noire à Genève. Traditionnel, japonais, ornemental, handpoke." />
  <meta property="og:image" content="https://www.nuitnoiretattoo.com/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="theme-color" content="#0a120d" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body data-page="shop">

  <div id="nav-mount"></div>

  <header class="page-header">
    <p class="page-eyebrow" id="page-eyebrow"></p>
    <h1 class="page-title" id="page-title">Shop</h1>
    <p class="page-subtitle" id="page-subtitle"></p>
  </header>

  <nav class="shop-filters" id="shop-filters" aria-label="Filtrer les produits">
    <button class="shop-filter is-active" data-filter="all" data-i18n="shop_filter_all">Tout</button>
    <button class="shop-filter" data-filter="print" data-i18n="shop_filter_print">Prints</button>
    <button class="shop-filter" data-filter="merch" data-i18n="shop_filter_merch">Merch</button>
  </nav>

  <main class="shop-grid-wrapper">
    <div class="shop-grid" id="shop-grid">
      <!-- Injecté par JS -->
    </div>

    <div class="shop-empty" id="shop-empty" hidden>
      <p data-i18n="shop_empty">Aucun produit dans cette catégorie pour le moment.</p>
    </div>
  </main>

  <section class="shop-info">
    <div class="shop-info-block">
      <h3 data-i18n="shop_order_heading">Commander</h3>
      <p id="order-info"></p>
      <a href="/contact" class="link-underline" data-i18n="shop_contact_us">Nous contacter →</a>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="js/media.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
