# =============================================================
# Nuit Noire Tattoo - Configuration Decap CMS (bilingue FR / EN)
# =============================================================
# Interface d'administration : /admin/
#
# Le menu de gauche compte quatre entrees :
#   📄 Pages      les textes de chaque page (accueil, artistes, shop,
#                 a propos, FAQ, contact) + les photos de l'accueil
#   🎨 Artistes   une fiche par artiste
#   🛍 Produits   une fiche par produit du shop (prix, tailles, stock)
#   🚚 Livraison  les frais de port par zone de la boutique en ligne
#   ⚙️ Reglages   coordonnees, horaires, textes des boutons
#
# Chaque texte traduisible a deux champs : Francais et English.
# Les photos utilisent les widgets maison "nn-gallery" et "nn-photo"
# (voir admin/nn-photos.js) : ajout groupe, reorganisation, recadrage.
# L'apercu a droite du formulaire vient de admin/nn-preview.js.
# =============================================================

backend:
  name: git-gateway
  repo: thibaudps/nuitnoiretattoo
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/ce3448f1-2a51-4357-b24f-c64dcde60751/pkce
  auth_token_endpoint: /sites/ce3448f1-2a51-4357-b24f-c64dcde60751/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: 'Creation {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Modification {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Suppression {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Suppression "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://www.nuitnoiretattoo.com
display_url: https://www.nuitnoiretattoo.com
locale: fr

editor:
  preview: true
collections:



  - name: pages
    label: 📄 Pages
    label_singular: Page
    description: Les textes de chaque page du site. Les photos de l'accueil sont ici aussi.
    delete: false
    files:
      - name: "homepage"
        label: "Accueil"
        file: "data/home.json"
        fields:
          - label: "Phrases qui defilent dans l'animation"
            name: "phrases"
            widget: "list"
            summary: "{{fields.text.fr}}"
            hint: "Les phrases apparaissent dans l'ordre, apres le logo."
            fields:

              - label: "Phrase"
                name: "text"
                widget: "object"
                fields:
                  - label: "🇫🇷 Francais"
                    name: "fr"
                    widget: "string"
                  - label: "🇬🇧 English"
                    name: "en"
                    widget: "string"


          - label: "Texte de presentation"
            name: "intro_text"
            widget: "object"
            hint: "Le texte court sous l'animation."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"


          - label: "Titre de la section photos"
            name: "latest_work_title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Derniers travaux"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Latest work"


          - label: "Lien Instagram affiche a droite du titre"
            name: "instagram_handle"
            widget: "string"
            default: "@nuitnoiretattoo"


          - label: "Photos de la grille (Latest work)"
            name: "latest_work"
            widget: "nn-gallery"
            required: false
            ratio: "3:4"
            columns: 3
            max_visible: 6
            allow_link: true
            hint: "Ajoutez plusieurs photos d'un coup (ou deposez-les dans le cadre). Glissez une vignette pour la deplacer, cliquez dessus pour recadrer. Seules les 6 premieres apparaissent sur le site."


      - name: "artists_page"
        label: "Artistes - titre de la page"
        file: "data/artists-page.json"
        fields:

          - label: "Etiquette (eyebrow)"
            name: "eyebrow"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Nuit Noire's"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Nuit Noire's"


          - label: "Titre"
            name: "title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Artistes"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Artists"


          - label: "Sous-titre"
            name: "subtitle"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Huit univers, un seul toit."
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Eight worlds, one roof."


        preview_path: artists
      - name: "shop_page"
        label: "Shop - titres et textes"
        file: "data/shop-page.json"
        fields:

          - label: "Etiquette (eyebrow)"
            name: "eyebrow"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Boutique"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Shop"


          - label: "Titre"
            name: "title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Shop"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Shop"


          - label: "Sous-titre"
            name: "subtitle"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Prints, objets du shop."
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Prints, shop goods."


          - label: "Texte 'Commander'"
            name: "order_info"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
                default: "Pour acquerir un print ou un objet du shop, contactez-nous directement par email ou via Instagram."
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"
                default: "To get a print or a shop item, contact us directly by email or via Instagram."


        preview_path: shop
      - name: "about_page"
        label: "À propos"
        file: "data/about.json"
        fields:

          - label: "Etiquette (eyebrow)"
            name: "eyebrow"
            widget: "object"
            required: false
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Le studio"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "The studio"


          - label: "Titre"
            name: "title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "À propos"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "About"


          - label: "Sous-titre"
            name: "subtitle"
            widget: "object"
            required: false
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Un salon indépendant, huit univers."
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "An independent studio, eight worlds."


          - label: "Photo"
            name: "image"
            widget: "nn-photo"
            required: false
            ratio: "auto"
            hint: "Photo affichee en haut de la page (l'equipe, le studio...). Elle s'affiche en entier : pas de recadrage."


          - label: "Texte alternatif de la photo"
            name: "image_alt"
            widget: "object"
            required: false
            hint: "Decrit la photo (accessibilite et referencement)."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "L'equipe de Nuit Noire devant le studio a Geneve"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "The Nuit Noire team in front of the studio in Geneva"


          - label: "Texte"
            name: "body"
            widget: "object"
            hint: "Laisse une ligne vide entre deux paragraphes."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"


        preview_path: about
      - name: "faq_page"
        label: "FAQ"
        file: "data/faq.json"
        fields:

          - label: "Etiquette (eyebrow)"
            name: "eyebrow"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Questions frequentes"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Frequently asked"


          - label: "Titre"
            name: "title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "FAQ"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "FAQ"


          - label: "Sous-titre"
            name: "subtitle"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Reponses aux questions frequentes."
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Answers to common questions."


          - label: "Questions"
            name: "items"
            widget: "list"
            summary: "{{fields.question.fr}}"
            hint: "Ajoute, supprime et reorganise les questions par glisser-deposer."
            fields:

              - label: "Question"
                name: "question"
                widget: "object"
                fields:
                  - label: "🇫🇷 Francais"
                    name: "fr"
                    widget: "string"
                  - label: "🇬🇧 English"
                    name: "en"
                    widget: "string"


              - label: "Reponse"
                name: "answer"
                widget: "object"
                hint: "Lien : [texte affiche](adresse). Ex. [email](contact.html)."
                fields:
                  - label: "🇫🇷 Francais"
                    name: "fr"
                    widget: "text"
                  - label: "🇬🇧 English"
                    name: "en"
                    widget: "text"


        preview_path: faq
      - name: "contact_page"
        label: "Contact"
        file: "data/contact.json"
        fields:

          - label: "Etiquette (eyebrow)"
            name: "eyebrow"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Une idee ?"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "An idea?"


          - label: "Titre"
            name: "title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Contact"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Contact"


          - label: "Sous-titre"
            name: "subtitle"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Ecrivez-nous, ou passez nous voir au shop."
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Write to us, or drop by the shop."


          - label: "Adresse"
            name: "address"
            widget: "object"
            hint: "Une ligne par retour a la ligne."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"


          - label: "Telephone"
            name: "phone"
            widget: "string"
            required: false
            default: "+41 (0)22 341 18 82"


          - label: "Acces TPG"
            name: "access_tpg"
            widget: "object"
            required: false
            hint: "Affiche sous la carte. Laisser vide pour masquer."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Arret Blandonnet"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "Blandonnet stop"


          - label: "Acces CFF"
            name: "access_cff"
            widget: "object"
            required: false
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Arret Vernier"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "Vernier station"


          - label: "Parking"
            name: "parking"
            widget: "object"
            required: false
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Centre Commercial Blandonnet"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "Blandonnet shopping centre"


          - label: "Adresse pour la carte Google Maps"
            name: "map_query"
            widget: "string"
            default: "Chemin des Coquelicots 7, 1214 Vernier, Suisse"
            hint: "Adresse envoyee a Google Maps pour centrer la carte."


          - label: "Horaires"
            name: "hours"
            widget: "object"
            hint: "Texte libre. Ex. : Mardi - Samedi / 11h - 19h"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"


          - label: "Note sur les horaires"
            name: "hours_note"
            widget: "object"
            required: false
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                required: false
                default: "Sur rendez-vous"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                required: false
                default: "By appointment"


          - label: "Email"
            name: "email"
            widget: "string"
            pattern: ["^[^@]+@[^@]+\\.[^@]+$", "Email invalide"]


          - label: "Compte Instagram"
            name: "instagram"
            widget: "string"
            default: "nuitnoiretattoo"
            hint: "Sans le @ devant."


          - label: "Introduction du formulaire - Titre"
            name: "form_intro_title"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "string"
                default: "Decrivez votre projet"
              - label: "🇬🇧 English"
                name: "en"
                widget: "string"
                default: "Describe your project"


          - label: "Introduction du formulaire - Texte"
            name: "form_intro_text"
            widget: "object"
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
                default: "Le bouton ci-dessous ouvrira votre application mail avec un message pre-rempli. Plus vos informations sont precises, plus la reponse sera rapide."
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"
                default: "The button below opens your mail app with a pre-filled message. The more precise your details, the faster the reply."


          - label: "Note photos (formulaire)"
            name: "form_photos_note"
            widget: "object"
            required: false
            hint: "Phrase sous l'intro. Laisser vide pour masquer."
            fields:
              - label: "🇫🇷 Francais"
                name: "fr"
                widget: "text"
                required: false
                default: "Vous pouvez joindre a votre email des photos de reference et/ou de l'emplacement souhaite, dans la limite de 4 photos."
              - label: "🇬🇧 English"
                name: "en"
                widget: "text"
                required: false
                default: "You can attach reference photos and/or photos of the desired placement to your email, up to 4 photos."


        preview_path: contact
  - name: "artists"
    label: "🎨 Artistes"
    label_singular: "Artiste"
    description: "Une fiche par artiste : bio, portrait, portfolio, Instagram."
    folder: "data/artists"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    identifier_field: "name"
    summary: "{{name}} - {{role}}"
    sortable_fields: ['order', 'name']
    view_groups:
      - label: Role
        field: role
    fields:
      - label: "Ordre d'affichage"
        name: "order"
        widget: "number"
        default: 1
        value_type: "int"
        min: 1
        hint: "Ordre des artistes sur la page (1 = en premier)."

      - label: "Nom complet"
        name: "name"
        widget: "string"

      - label: "Identifiant (slug)"
        name: "id"
        widget: "string"
        hint: "Nom de fichier et ancre URL. Minuscules, chiffres, tirets. Ne pas modifier apres creation."
        pattern: ['^[a-z0-9-]+$', "Que des minuscules, chiffres et tirets"]

      - label: "Role"
        name: "role"
        widget: "select"
        options: ["Fondateur", "Fondatrice", "Résident", "Résidente", "Invité", "Invitée"]
        default: "Résident"
        hint: "La traduction anglaise est automatique (Founder / Resident / Guest)."

      - label: "Page Guests"
        name: "guest"
        widget: "boolean"
        default: false
        required: false
        hint: "Coche pour la page guests : nom en italique, layout simplifie."


      - label: "Bio (francais)"
        name: "bio"
        widget: "text"
        required: false
        hint: "Petit texte de presentation (2-3 phrases). Optionnel pour les guests."


      - label: "Bio (English)"
        name: "bio_en"
        widget: "text"
        required: false
        hint: "Traduction anglaise. Laisser vide = la version francaise s'affiche aussi en anglais."


      - label: "Portrait"
        name: "portrait"
        widget: "nn-photo"
        required: false
        ratio: "3:4"
        hint: "N'importe quel format : la photo se recadre dans le cadre 3:4 du site (glissez-la, zoomez)."

      - label: "Compte Instagram"
        name: "instagram"
        widget: "string"
        required: false
        hint: "Sans le @ devant. Ex. : 'vincepages_tattoo'"

      - label: "Portfolio (photos de tatouages)"
        name: "portfolio"
        widget: "nn-gallery"
        required: false
        ratio: "3:4"
        columns: 3
        allow_link: true
        hint: "Ajoutez plusieurs photos d'un coup (ou deposez-les dans le cadre). Glissez une vignette pour la deplacer, cliquez dessus pour la recadrer ou lui donner un lien."


    preview_path: artists#{{id}}
  - name: "products"
    label: "🛍 Produits"
    label_singular: "Produit"
    description: "Une fiche par produit du shop."
    folder: "data/products"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} - {{price}} CHF"
    sortable_fields: ['name', 'category', 'available']
    view_groups:
      - label: Categorie
        field: category
      - label: Disponibilite
        field: available
    fields:
      - label: "Nom du produit"
        name: "name"
        widget: "string"

      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - {label: "Print", value: "print"}
          - {label: "Merch (textile, accessoires)", value: "merch"}
        default: "print"

      - label: "Artiste"
        name: "artist"
        widget: "string"
        hint: "Nom de l'artiste auteur du produit (ou 'Nuit Noire')."

      - label: "Prix (CHF)"
        name: "price"
        widget: "number"
        value_type: "float"
        min: 0
        step: 0.05
        hint: "Chiffres uniquement, en francs suisses. Ex. : 45 ou 39.90. Le '.-' est ajoute automatiquement a l'affichage."

      - label: "Photos"
        name: "images"
        widget: "nn-gallery"
        required: false
        ratio: "3:4"
        columns: 3
        max_visible: 3
        hint: "Jusqu'a 3 photos. La premiere est celle qui apparait dans la grille du shop ; les suivantes se feuillettent avec les fleches, et un clic sur la photo l'ouvre en grand. Au-dela de 3, les vignettes sont grisees et ignorees par le site. Cliquez sur une vignette pour la recadrer dans le cadre 3:4."


      - label: "Description (francais)"
        name: "description"
        widget: "text"
        required: false


      - label: "Description (English)"
        name: "description_en"
        widget: "text"
        required: false
        hint: "Traduction anglaise. Laisser vide = la version francaise s'affiche aussi en anglais."


      - label: "Visible sur le site"
        name: "available"
        widget: "boolean"
        default: true
        hint: "Decoche pour retirer completement le produit de la boutique, sans supprimer la fiche."

      - label: "Vendable en ligne"
        name: "sellable"
        widget: "boolean"
        default: true
        hint: "Decoche pour un produit vitrine : il reste affiche avec son prix, mais sans bouton d'achat. Le visiteur passe alors par le bloc 'Commander' en bas de la page shop."


      # --- STOCK -------------------------------------------------
      # Deux cas, jamais les deux a la fois :
      #   - le produit a des tailles  -> on remplit la liste ci-dessous
      #   - le produit n'en a pas     -> on laisse la liste vide et on
      #                                  renseigne "Stock" plus bas
      # Ces quantites baissent toutes seules a chaque paiement encaisse.
      - label: "Tailles et stock par taille"
        name: "variants"
        widget: "list"
        required: false
        summary: "{{fields.size}} - {{fields.stock}} en stock"
        label_singular: "Taille"
        hint: "Uniquement pour les produits declines en tailles (tee-shirts...). Laissez VIDE pour un produit sans taille : c'est le champ 'Stock' juste en dessous qui compte alors. Ces quantites diminuent automatiquement a chaque vente."
        fields:
          - label: "Taille"
            name: "size"
            widget: "string"
            hint: "Ex. : XS, S, M, L, XL. Pour un print : A3, 50x70..."
          - label: "Quantite en stock"
            name: "stock"
            widget: "number"
            value_type: "int"
            min: 0
            default: 0

      - label: "Stock (produit sans taille)"
        name: "stock"
        widget: "number"
        value_type: "int"
        min: 0
        default: 0
        required: false
        hint: "Quantite disponible pour un produit sans taille (casquette, print, accessoire). IGNORE si la liste des tailles ci-dessus est remplie. Baisse automatiquement a chaque vente."


    preview_path: shop

  # -----------------------------------------------------------
  # LIVRAISON
  # -----------------------------------------------------------
  # La grille des frais de port de la boutique en ligne.
  # Formule appliquee a chaque commande :
  #     port = tarif de base + supplement x (nombre d'articles - 1)
  # Exemple : 3 tee-shirts vers la France, base 12 et supplement 2
  #     -> 12 + 2 x 2 = 16 CHF
  # Un pays ne doit apparaitre que dans UNE seule zone. Un pays absent de
  # toutes les zones n'est pas propose au client : c'est ainsi qu'on
  # decide ou l'on expedie.
  # -----------------------------------------------------------
  - name: "shipping"
    label: "🚚 Livraison"
    label_singular: "Livraison"
    description: "Frais de port par zone, et avertissement douane."
    delete: false
    editor:
      preview: false
    files:
      - name: "shipping_zones"
        label: "Zones et frais de port"
        file: "data/shipping.json"
        fields:

          - label: "Devise de la boutique"
            name: "currency"
            widget: "select"
            options:
              - { label: "Franc suisse (CHF)", value: "CHF" }
              - { label: "Euro (EUR)", value: "EUR" }
            default: "CHF"
            hint: "Une seule devise pour toute la boutique. Changer ce reglage ne convertit PAS les prix des produits : il faut les ressaisir."

          - label: "Zones de livraison"
            name: "zones"
            widget: "list"
            label_singular: "Zone"
            summary: "{{fields.label.fr}} - base {{fields.base}} + {{fields.extra_item}}/article"
            hint: "Glissez pour reordonner : c'est l'ordre du menu deroulant sur la page panier."
            fields:

              - label: "Identifiant technique"
                name: "id"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "Minuscules, chiffres et tirets uniquement"]
                hint: "Ne pas modifier apres creation. Ex. : ch, eu, uk, us, world"

              - label: "Nom de la zone"
                name: "label"
                widget: "object"
                fields:
                  - label: "🇫🇷 Francais"
                    name: "fr"
                    widget: "string"
                  - label: "🇬🇧 English"
                    name: "en"
                    widget: "string"

              - label: "Tarif de base"
                name: "base"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.05
                hint: "Prix pour le premier article, dans la devise de la boutique."

              - label: "Supplement par article en plus"
                name: "extra_item"
                widget: "number"
                value_type: "float"
                min: 0
                step: 0.05
                default: 1
                hint: "Ajoute pour chaque article au-dela du premier. Mettre 0 pour un forfait unique quel que soit le nombre d'articles."

              - label: "Port offert a partir de"
                name: "free_from"
                widget: "number"
                value_type: "float"
                min: 0
                required: false
                hint: "Laisser VIDE pour ne jamais offrir le port. Sinon, montant du panier (hors port) a partir duquel la livraison est gratuite dans cette zone."

              - label: "Delai minimum (jours ouvres)"
                name: "delivery_min"
                widget: "number"
                value_type: "int"
                min: 1
                required: false
                hint: "Affiche au client sur la page panier et sur la page de paiement. Laisser vide pour ne rien annoncer."

              - label: "Delai maximum (jours ouvres)"
                name: "delivery_max"
                widget: "number"
                value_type: "int"
                min: 1
                required: false

              - label: "Pays de cette zone"
                name: "countries"
                widget: "select"
                multiple: true
                hint: "Tous les pays qui paient ce tarif. Un pays ne doit figurer que dans une seule zone. Un pays qui n'est dans aucune zone n'est pas livrable."
